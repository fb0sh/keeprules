name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI must behave identically on case-insensitive filesystems
        # (macOS, Windows) and case-sensitive ones (Linux).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke test the CLI
        run: |
          node bin/keeprules.js --version
          node bin/keeprules.js --help

  package:
    name: package install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack and install into a fresh project
        run: |
          npm pack --pack-destination .
          tarball="$(ls keeprules-*.tgz | head -n 1)"
          mkdir demo
          cd demo
          npm init -y
          npm install "../${tarball}"
          npx keeprules --version
